        required: true
        schema:
          $ref: '#/definitions/github_com_tracerbiubiubiu_zhuzhao_internal_model.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 刷新成功
          schema:
            $ref: '#/definitions/response.Response'
      summary: 刷新 Token
      tags:
