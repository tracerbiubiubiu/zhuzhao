      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: 待办角标聚合（sections 开放 map——前端 60s 轮询；未知 section 前端忽略）
      tags:
      - badge
  /api/v1/dead-letters:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 死信列表（运维向，配合 retry 端点闭环）
      tags:
      - tasks
  /api/v1/dict-items:
    post:
      consumes:
      - application/json
      parameters:
      - description: 字典写入请求
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/github_com_tracerbiubiubiu_zhuzhao_internal_model.CreateDictItemRequest'
      produces:
