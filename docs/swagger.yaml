              type: object
        "400":
          description: 91001 超限 / 91002 类型不允许 / 10003 参数错误
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
