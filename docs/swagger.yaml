      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  github_com_tracerbiubiubiu_zhuzhao_internal_model.PresignUploadInput:
    properties:
      file_name:
        type: string
      mime_type:
        type: string
      purpose:
        type: string
      size_bytes:
        example: "0"
        type: string
      ticket_id:
        example: "0"
        type: string
    required:
    - file_name
    - mime_type
    - purpose
    - size_bytes
    type: object
  github_com_tracerbiubiubiu_zhuzhao_internal_model.PresignUploadResponse:
    properties:
      expires_at:
        type: string
      headers:
        additionalProperties:
          type: string
        type: object
      method:
        type: string
      object_key:
        type: string
      upload_url:
        type: string
    type: object
  github_com_tracerbiubiubiu_zhuzhao_internal_model.PublishedTicketForm:
    properties:
      definition_ref:
        $ref: '#/definitions/github_com_tracerbiubiubiu_zhuzhao_internal_model.TicketDefinitionRef'
      fields:
        items:
          $ref: '#/definitions/github_com_tracerbiubiubiu_zhuzhao_internal_model.PublishedTicketFormField'
        type: array
      type:
        $ref: '#/definitions/github_com_tracerbiubiubiu_zhuzhao_internal_model.PublishedTicketFormType'
    type: object
  github_com_tracerbiubiubiu_zhuzhao_internal_model.PublishedTicketFormField:
    properties:
      field_id:
        example: "0"
        type: string
      field_key:
        type: string
      field_label:
        type: string
      field_meta:
        $ref: '#/definitions/github_com_tracerbiubiubiu_zhuzhao_internal_model.PublishedTicketFormFieldMeta'
      field_options:
        items:
          type: integer
        type: array
      field_type:
        type: string
      required:
        type: boolean
      sort_order:
        type: integer
      type_code:
        type: string
      validate_regex:
        type: string
    type: object
  github_com_tracerbiubiubiu_zhuzhao_internal_model.PublishedTicketFormFieldMeta:
    properties:
      col_span:
        type: integer
      formula:
        type: string
