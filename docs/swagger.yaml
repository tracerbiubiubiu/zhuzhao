definitions:
  model.AssignTicketRequest:
    properties:
      assigned_to:
        description: nil = 取消分派
        example: "0"
        type: string
      id:
        example: "0"
        type: string
    required:
    - id
    type: object
  model.CloseTicketRequest:
    properties:
      comment:
        description: 可选关闭说明
        type: string
      id:
        example: "0"
        type: string
    required:
    - id
    type: object
  model.CreateCommentRequest:
    properties:
      content:
        type: string
      ticket_id:
        example: "0"
        type: string
    required:
    - content
    - ticket_id
    type: object
  model.CreateNoteRequest:
    properties:
      content:
        type: string
      ticket_id:
        example: "0"
        type: string
    required:
    - content
    - ticket_id
    type: object
  model.CreateRelationRequest:
    properties:
      relation_type:
        description: 默认 related
        type: string
      source_ticket_id:
        example: "0"
        type: string
      target_ticket_id:
        example: "0"
        type: string
    required:
    - source_ticket_id
    - target_ticket_id
    type: object
  model.CreateTicketRequest:
    type: object
  model.CreateTicketTemplateRequest:
    type: object
  model.CreateTicketTypeRequest:
    type: object
  model.DeleteTicketRequest:
    properties:
      id:
        example: "0"
        type: string
    required:
    - id
    type: object
  model.LoginRequest:
    properties:
      device_id:
        description: D2-01：max=64——device_id 进 RT JWT claims 与 Redis 键（refresh:{uid}:{device}）
        maxLength: 64
        type: string
      device_name:
        maxLength: 64
        type: string
      employee_no:
        description: |-
          D2-01：max 对齐 DB varchar(50)——employee_no 直接进 Redis 锁定键
          （lock:login:{employee_no}），无上限时可灌入超大键撑爆 maxmemory 驱逐安全键
        maxLength: 50
        type: string
      password:
        type: string
    required:
    - employee_no
    - password
    type: object
  model.LogoutRequest:
    properties:
      device_id:
        description: 与登录时一致；空则使用 default
        type: string
    type: object
  model.RefreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  model.ReplaceTypeFieldsRequest:
    type: object
  model.SetOrgMemberRoleRequest:
    properties:
      org_id:
        example: "0"
        type: string
      org_member_role:
        enum:
        - member
        - admin
        type: string
      user_id:
        example: "0"
        type: string
    required:
    - org_id
    - org_member_role
    - user_id
    type: object
  model.SetOrgOwnersRequest:
    properties:
      org_id:
        example: "0"
        type: string
      owner_user_ids:
        description: 元素为字符串 ID（项目惯例）；空数组=清空（仅全局）
        items:
          type: integer
        type: array
    required:
    - org_id
    - owner_user_ids
    type: object
  model.UpdatePasswordRequest:
    properties:
      device_id:
        description: 与登录时一致；空则使用 default
        type: string
      new_password:
        minLength: 8
        type: string
      old_password:
        type: string
    required:
    - new_password
    - old_password
    type: object
  model.UpdateTicketRequest:
    properties:
      description:
        type: string
      id:
        example: "0"
        type: string
      priority:
        type: integer
      title:
        type: string
    required:
    - id
    type: object
  model.UpdateTicketTemplateRequest:
    type: object
  model.UpdateTicketTypeRequest:
    type: object
  response.Response:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
      request_id:
        type: string
    type: object
info:
  contact: {}
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: 登录请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 登录成功，返回 Token 对
          schema:
            $ref: '#/definitions/response.Response'
      summary: 用户登录
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      consumes:
      - application/json
      parameters:
      - description: 登出请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.LogoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 登出成功
          schema:
            $ref: '#/definitions/response.Response'
      summary: 用户登出
      tags:
      - auth
  /api/v1/auth/password/update:
    post:
      consumes:
      - application/json
      parameters:
      - description: 修改密码请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.UpdatePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 修改成功
          schema:
            $ref: '#/definitions/response.Response'
      summary: 修改密码
      tags:
      - auth
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      parameters:
      - description: 刷新请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 刷新成功
          schema:
            $ref: '#/definitions/response.Response'
      summary: 刷新 Token
      tags:
      - auth
  /api/v1/orgs/members/role:
    post:
      consumes:
      - application/json
      parameters:
      - description: 变更组内角色请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.SetOrgMemberRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: 任命/变更组内角色
      tags:
      - org
  /api/v1/orgs/owners:
    post:
      consumes:
      - application/json
      parameters:
      - description: 设置负责人请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.SetOrgOwnersRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: 设置组织负责人
      tags:
      - org
  /api/v1/ticket-templates:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: 工单模板列表
      tags:
      - ticket
    post:
      consumes:
      - application/json
      parameters:
      - description: 模板定义
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/model.CreateTicketTemplateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: 新建工单模板
      tags:
      - ticket-admin
  /api/v1/ticket-templates/{code}:
    delete:
      parameters:
      - description: 模板编码
        in: path
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: 删除工单模板
      tags:
      - ticket-admin
    get:
      parameters:
      - description: 模板编码
        in: path
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: 工单模板详情
      tags:
      - ticket
    put:
      consumes:
      - application/json
      parameters:
      - description: 模板编码
        in: path
        name: code
        required: true
        type: string
      - description: 更新内容
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/model.UpdateTicketTemplateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: 更新工单模板（patch；code/type/org 不可改）
      tags:
      - ticket-admin
  /api/v1/ticket-types:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: 工单类型列表
      tags:
      - ticket
    post:
      consumes:
      - application/json
      parameters:
      - description: 类型定义
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/model.CreateTicketTypeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: 新建工单类型
      tags:
      - ticket-admin
  /api/v1/ticket-types/{code}:
    delete:
      parameters:
      - description: 类型编码
        in: path
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: 删除工单类型（有工单禁删 → 409）
      tags:
      - ticket-admin
    put:
      consumes:
      - application/json
      parameters:
      - description: 类型编码
        in: path
        name: code
        required: true
        type: string
      - description: 更新内容
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/model.UpdateTicketTypeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: 更新工单类型（patch；code 不可改）
      tags:
      - ticket-admin
  /api/v1/ticket-types/{code}/fields:
    get:
      parameters:
      - description: 工单类型编码
        in: path
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: 工单类型字段定义
      tags:
      - ticket
    put:
      consumes:
      - application/json
      parameters:
      - description: 类型编码
        in: path
        name: code
        required: true
        type: string
      - description: 字段集
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/model.ReplaceTypeFieldsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: 全量替换类型字段集
      tags:
      - ticket-admin
  /api/v1/ticket-types/{code}/fields/admin:
    get:
      parameters:
      - description: 类型编码
        in: path
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: 类型字段读取（含 validate_regex，管理端）
      tags:
      - ticket-admin
  /api/v1/ticket-types/admin:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: 工单类型全量列表（含停用，管理端）
      tags:
      - ticket-admin
  /api/v1/tickets:
    get:
      consumes:
      - application/json
      parameters:
      - description: 页码
        in: query
        name: page
        type: integer
      - description: 每页条数
        in: query
        name: page_size
        type: integer
      - description: 工单类型
        in: query
        name: type_code
        type: string
      - description: 工单状态
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: 工单列表
      tags:
      - ticket
    post:
      consumes:
      - application/json
      parameters:
      - description: 创建工单请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.CreateTicketRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: 创建工单
      tags:
      - ticket
  /api/v1/tickets/{id}:
    get:
      parameters:
      - description: 工单 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: 工单详情
      tags:
      - ticket
  /api/v1/tickets/{id}/comments:
    get:
      parameters:
      - description: 工单 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: 工单回复列表
      tags:
      - ticket
  /api/v1/tickets/{id}/relations:
    get:
      parameters:
      - description: 工单 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: 工单关联列表
      tags:
      - ticket
  /api/v1/tickets/assign:
    post:
      consumes:
      - application/json
      parameters:
      - description: 分派工单请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.AssignTicketRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: 分派工单
      tags:
      - ticket
  /api/v1/tickets/close:
    post:
      consumes:
      - application/json
      parameters:
      - description: 关闭工单请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.CloseTicketRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: 关闭工单
      tags:
      - ticket
  /api/v1/tickets/comments:
    post:
      consumes:
      - application/json
      parameters:
      - description: 创建回复请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.CreateCommentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: 创建工单回复
      tags:
      - ticket
  /api/v1/tickets/delete:
    post:
      consumes:
      - application/json
      parameters:
      - description: 删除工单请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.DeleteTicketRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: 删除工单
      tags:
      - ticket
  /api/v1/tickets/notes:
    post:
      consumes:
      - application/json
      parameters:
      - description: 创建备注请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.CreateNoteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: 创建内部备注
      tags:
      - ticket
  /api/v1/tickets/relations:
    post:
      consumes:
      - application/json
      parameters:
      - description: 建立关联请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.CreateRelationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: 建立工单关联
      tags:
      - ticket
  /api/v1/tickets/update:
    post:
      consumes:
      - application/json
      parameters:
      - description: 更新工单请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.UpdateTicketRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: 更新工单
      tags:
      - ticket
swagger: "2.0"
