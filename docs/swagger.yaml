  github_com_tracerbiubiubiu_zhuzhao_internal_model.PublishedTicketFormType:
    properties:
      code:
        type: string
      default_sla_hours:
        type: integer
      description:
        type: string
      has_custom_fields:
        type: boolean
      is_active:
        type: boolean
      name:
        type: string
      states:
        items:
          type: integer
        type: array
      transitions:
        items:
          type: integer
        type: array
    type: object
  github_com_tracerbiubiubiu_zhuzhao_internal_model.RefreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  github_com_tracerbiubiubiu_zhuzhao_internal_model.RemoveTicketCCRequest:
    properties:
      ticket_id:
        example: "0"
        type: string
      user_id:
        example: "0"
        type: string
    required:
    - ticket_id
    - user_id
    type: object
  github_com_tracerbiubiubiu_zhuzhao_internal_model.RemoveTicketTagRequest:
