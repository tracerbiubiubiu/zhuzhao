info:
  contact: {}
  description: zhuzhao——Go 模块化单体 IAM + 工单系统（三层鉴权 + 资源级工单）
  title: zhuzhao API
  version: "1.0"
paths:
  /api/v1/assignment-rules:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: 自动分派规则列表
      tags:
      - ticket
    post:
      consumes:
      - application/json
      parameters:
      - description: 规则
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_tracerbiubiubiu_zhuzhao_internal_model.CreateAssignmentRuleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: 建自动分派规则（target_user 须属 target_org——决议③写侧校验）
      tags:
      - ticket
  /api/v1/assignment-rules/delete:
    post:
      consumes:
      - application/json
      parameters:
      - description: 规则 ID
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_tracerbiubiubiu_zhuzhao_internal_model.AssignmentRuleIDRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: 删自动分派规则
      tags:
      - ticket
  /api/v1/assignment-rules/enabled:
    post:
      consumes:
      - application/json
      parameters:
      - description: 启停
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_tracerbiubiubiu_zhuzhao_internal_model.UpdateAssignmentRuleEnabledRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: 启停自动分派规则
      tags:
      - ticket
  /api/v1/audit/logs:
    get:
      consumes:
      - application/json
      parameters:
      - description: 页码（默认 1）
        in: query
        name: page
        type: integer
      - description: 每页条数（默认 20）
        in: query
        name: page_size
        type: integer
      - description: 请求路径过滤
        in: query
        name: path
        type: string
      - description: 用户 ID
        in: query
        name: user_id
        type: integer
      - description: 开始日期（YYYY-MM-DD）
        in: query
        name: start
        type: string
      - description: 结束日期（YYYY-MM-DD）
        in: query
        name: end
        type: string
      - description: 工号
        in: query
        name: employee_no
        type: string
      - description: HTTP 方法（单值或逗号分隔多值，如 GET,POST）
        in: query
        name: method
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 审计日志列表
      tags:
      - audit
  /api/v1/auth/captcha:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: 登录验证码（enabled=false 时仅返回开关态——前端据此显隐插槽）
      tags:
      - auth
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: 登录请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_tracerbiubiubiu_zhuzhao_internal_model.LoginRequest'
      produces:
