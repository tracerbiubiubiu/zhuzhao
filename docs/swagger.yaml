        type: string
      operation_id:
        maxLength: 128
        type: string
      org_id:
        example: "0"
        type: string
      owner_user_id:
        example: "0"
        type: string
      system_ref:
        type: string
      title:
        maxLength: 200
        type: string
    required:
    - operation_id
    - org_id
    - title
    type: object
  github_com_tracerbiubiubiu_zhuzhao_internal_model.RiskEvidenceRef:
