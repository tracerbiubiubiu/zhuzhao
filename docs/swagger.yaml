definitions:
  github_com_tracerbiubiubiu_zhuzhao_internal_model.AddTicketCCRequest:
    properties:
      ticket_id:
        example: "0"
        type: string
      user_ids:
        items:
          type: string
        maxItems: 20
        type: array
    required:
    - ticket_id
    - user_ids
    type: object
  github_com_tracerbiubiubiu_zhuzhao_internal_model.AddTicketTagsRequest:
    properties:
      tags:
        items:
          type: string
        maxItems: 20
        type: array
      ticket_id:
        example: "0"
        type: string
    required:
    - tags
    - ticket_id
    type: object
  github_com_tracerbiubiubiu_zhuzhao_internal_model.AssignMenusRequest:
    properties:
      menu_ids:
        items:
          type: string
        type: array
      original_menu_ids:
        description: |-
          OriginalMenuIDs 是可选的原集合快照；空数组表示已读空集，省略/null 保留旧覆盖语义。
          条件只比较当前集合，不追踪集合变更后又恢复原值的中间历史。
        items:
          type: string
        type: array
      role_id:
        example: "0"
        type: string
    required:
    - menu_ids
    - role_id
    type: object
  github_com_tracerbiubiubiu_zhuzhao_internal_model.AssignTicketRequest:
    properties:
      assigned_to:
        description: nil = 取消分派
        example: "0"
        type: string
      escalation_supervisor_id:
        description: EscalationSupervisor 催办上级·人工指定（S10 B10-4——dd §31 基线档；nil=保持不动）
        example: "0"
        type: string
      id:
        example: "0"
        type: string
    required:
    - id
    type: object
  github_com_tracerbiubiubiu_zhuzhao_internal_model.AssignmentRuleIDRequest:
    properties:
      id:
        example: "0"
        type: string
    required:
    - id
    type: object
  github_com_tracerbiubiubiu_zhuzhao_internal_model.BindOrgRoleRequest:
    properties:
      org_id:
        example: "0"
        type: string
      role_id:
        example: "0"
        type: string
    required:
    - org_id
    - role_id
    type: object
  github_com_tracerbiubiubiu_zhuzhao_internal_model.CloseTicketRequest:
    properties:
      comment:
        description: 可选关闭说明
        type: string
      id:
        example: "0"
        type: string
    required:
    - id
    type: object
  github_com_tracerbiubiubiu_zhuzhao_internal_model.ConfirmFileInput:
    properties:
      object_key:
        type: string
      ticket_id:
        example: "0"
        type: string
    required:
    - object_key
    type: object
  github_com_tracerbiubiubiu_zhuzhao_internal_model.CreateAssignmentRuleRequest:
    properties:
      enabled:
        type: boolean
      keyword:
        type: string
      priority:
        type: integer
      target_org:
        example: "0"
        type: string
      target_user:
        example: "0"
        type: string
      type_code:
        maxLength: 50
        type: string
    required:
    - target_org
    - type_code
    type: object
  github_com_tracerbiubiubiu_zhuzhao_internal_model.CreateCommentRequest:
    properties:
      content:
        type: string
      ticket_id:
        example: "0"
        type: string
    required:
    - content
    - ticket_id
    type: object
  github_com_tracerbiubiubiu_zhuzhao_internal_model.CreateDictItemRequest:
    properties:
      code:
        type: string
      enabled:
        description: 缺省 true（建时即停用场景显式传 false）
        type: boolean
      label:
        type: string
      remark:
        type: string
      sort_order:
        type: integer
      type_code:
        type: string
      type_id:
        example: "0"
        type: string
    required:
    - code
    - label
    - type_code
    type: object
  github_com_tracerbiubiubiu_zhuzhao_internal_model.CreateNoteRequest:
    properties:
      content:
        type: string
      ticket_id:
        example: "0"
        type: string
    required:
    - content
    - ticket_id
    type: object
  github_com_tracerbiubiubiu_zhuzhao_internal_model.CreateRelationRequest:
    properties:
      relation_type:
        description: 默认 related
        type: string
      source_ticket_id:
        example: "0"
        type: string
      target_ticket_id:
        example: "0"
        type: string
    required:
    - source_ticket_id
    - target_ticket_id
    type: object
  github_com_tracerbiubiubiu_zhuzhao_internal_model.CreateRoleRequest:
    properties:
      code:
        maxLength: 50
        type: string
      description:
        type: string
      name:
        maxLength: 100
        type: string
      parent_id:
        description: |-
          BK-12：继承父（可选）。校验规则（2026-08-31 拍板）：child.priority ≤ parent.priority
          （子不弱于父）+ 父启用/非系统/无环/非自身。omitempty 已去（§3-14① 同概念同形态）：
          与 menu/org 请求侧对齐 null 形态，未传 = null = 不设父
        example: "0"
        type: string
      priority:
        type: integer
      sort_order:
        type: integer
      status:
        description: |-
          B4-4：指针区分「未传」（nil → 默认启用）与「显式传 0」（创建即禁用）——
          原零值合并导致无法创建禁用角色，与 Update 的 oneof=0 1 行为不一致
        enum:
        - 0
        - 1
        type: integer
    required:
    - code
    - name
    - priority
    type: object
  github_com_tracerbiubiubiu_zhuzhao_internal_model.CreateTicketRequest:
    properties:
      assigned_to:
        example: "0"
        type: string
      attachments:
        description: |-
          B5-3 建单前绑定（A.5 建单前链）：attachment_create/richtext_create 悬挂
          confirmed 对象键列表，Create 同事务校验+落绑 ticket_attachments。
          语义=增量落绑（只增不删）：解除绑定走 POST /tickets/attachments/delete
          （内嵌图 ticket_richtext 不可经该端点删——随工单生命周期，A.7）
        items:
          type: string
        type: array
      custom_data:
        type: object
      definition_hash:
        type: string
      definition_version:
        description: A preview pins the client's expected publication; legacy clients
          omit both.
        type: string
      description:
        type: string
      escalation_supervisor_id:
        description: EscalationSupervisor 催办上级·人工指定（S10 B10-4——dd §31 基线档；可后续 Assign
          改）
        example: "0"
        type: string
      org_id:
        example: "0"
        type: string
      priority:
        type: integer
      template_code:
        description: 可选：命中模板则预填
        type: string
      title:
        maxLength: 200
        type: string
      type_code:
        maxLength: 50
        type: string
    required:
    - org_id
    - title
    - type_code
    type: object
  github_com_tracerbiubiubiu_zhuzhao_internal_model.CreateTicketTemplateRequest:
    properties:
      code:
        maxLength: 50
        type: string
      default_fields:
        items:
          type: integer
        type: array
      default_priority:
        type: integer
      default_sla_minutes:
        type: integer
      name:
        maxLength: 200
        type: string
      org_id:
        example: "0"
        type: string
      type_code:
        maxLength: 50
        type: string
    required:
    - code
    - name
    - org_id
    - type_code
    type: object
  github_com_tracerbiubiubiu_zhuzhao_internal_model.CreateTicketTypeRequest:
    properties:
      code:
        maxLength: 50
        type: string
      description:
        type: string
      is_active:
        type: boolean
      name:
        maxLength: 100
        type: string
      states:
        items:
          type: integer
        type: array
      transitions:
        items:
          type: integer
        type: array
    required:
    - code
    - name
    type: object
  github_com_tracerbiubiubiu_zhuzhao_internal_model.CreateUserRequest:
    properties:
      avatar:
        maxLength: 500
        type: string
      domain_account:
        maxLength: 100
        type: string
      email:
        maxLength: 100
        type: string
      employee_no:
        maxLength: 50
        type: string
      org_ids:
        items:
          type: string
        type: array
      password:
        description: F-9：最小长度（完整复杂度策略 Phase 2）
        minLength: 8
        type: string
      phone:
        maxLength: 20
        type: string
      primary_org_id:
        example: "0"
        type: string
      real_name:
        maxLength: 100
        type: string
      role_ids:
        items:
          type: string
        type: array
      user_domain:
        maxLength: 255
        type: string
      username:
        maxLength: 50
        type: string
    required:
    - password
    - username
    type: object
  github_com_tracerbiubiubiu_zhuzhao_internal_model.DeleteByCodeRequest:
    properties:
      code:
        type: string
      id:
        description: ID 可选稳定身份；省略兼容旧编码调用，传入须命中原对象。
        example: "0"
        type: string
      version:
        type: integer
    required:
    - code
    type: object
  github_com_tracerbiubiubiu_zhuzhao_internal_model.DeleteTicketRequest:
    properties:
      id:
        example: "0"
        type: string
    required:
    - id
    type: object
  github_com_tracerbiubiubiu_zhuzhao_internal_model.FileObject:
    properties:
      bucket:
        type: string
      confirmed_at:
        type: string
      created_at:
        type: string
      created_by:
        example: "0"
        type: string
      etag:
        type: string
      file_name:
        type: string
      id:
        example: "0"
        type: string
      mime_type:
        type: string
      object_key:
        type: string
      owner_id:
        type: string
      owner_kind:
        description: |-
          通用归属引用（000047 随行件）：ticket 态 confirm/建单落绑填 ticket、avatar bind 填 user；
          NULL = 未归属（pending / *_create 悬挂态 / 存量行）。元数据面，不作判定依据。
        type: string
      purpose:
        type: string
      size_bytes:
        example: "0"
        type: string
      status:
        type: string
    type: object
  github_com_tracerbiubiubiu_zhuzhao_internal_model.FindingObservationV1:
    properties:
      asset_ref:
        $ref: '#/definitions/github_com_tracerbiubiubiu_zhuzhao_internal_model.RiskAssetRef'
      attributes:
        type: object
      conclusion_ref:
        type: string
      event_id:
        maxLength: 200
        type: string
      evidence_refs:
        items:
          $ref: '#/definitions/github_com_tracerbiubiubiu_zhuzhao_internal_model.RiskEvidenceRef'
        type: array
      finding_class:
        type: string
      finding_key:
        type: string
      mapping_ref:
        type: string
      observation_kind:
        description: observed|withdrawn|deleted，缺省 observed
        type: string
      observed_at:
        type: string
      port:
        type: integer
      source_item_key:
        maxLength: 300
        type: string
      source_ref:
        type: string
      source_sequence:
        type: string
      source_severity:
        $ref: '#/definitions/github_com_tracerbiubiubiu_zhuzhao_internal_model.RiskSourceSeverity'
      valid_until:
        type: string
    required:
    - event_id
    - mapping_ref
    - observed_at
    - source_item_key
    - source_ref
    type: object
  github_com_tracerbiubiubiu_zhuzhao_internal_model.IAMReceipt:
    properties:
      changed:
        type: boolean
      command:
        type: string
      local_policy_projection:
        type: string
      operation_id:
        type: string
      status:
        type: string
      target_id:
        example: "0"
        type: string
    type: object
  github_com_tracerbiubiubiu_zhuzhao_internal_model.LoginRequest:
    properties:
      captcha:
        maxLength: 8
        type: string
      captcha_id:
        description: |-
          P4-7 验证码（captcha.enabled=true 时必填——handler 层经 CaptchaService 校验；
          omitempty 保 dev/E2E 关闭态登录契约零变化）
        maxLength: 64
        type: string
      device_id:
        description: D2-01：max=64——device_id 进 RT JWT claims 与 Redis 键（refresh:{uid}:{device}）
        maxLength: 64
        type: string
      device_name:
        maxLength: 64
        type: string
      employee_no:
        description: |-
          D2-01：max 对齐 DB varchar(50)——employee_no 直接进 Redis 锁定键
          （lock:login:{employee_no}），无上限时可灌入超大键撑爆 maxmemory 驱逐安全键
        maxLength: 50
        type: string
      password:
        type: string
    required:
    - employee_no
    - password
    type: object
  github_com_tracerbiubiubiu_zhuzhao_internal_model.LogoutRequest:
    properties:
      device_id:
        description: 与登录时一致；空则使用 default
        type: string
    type: object
  github_com_tracerbiubiubiu_zhuzhao_internal_model.MyOrgItem:
    properties:
      is_primary:
        type: boolean
      is_virtual:
        type: boolean
      joined_at:
        type: string
      org_code:
        type: string
      org_id:
        example: "0"
        type: string
      org_member_role:
        type: string
      org_name:
        type: string
      ticket_scope:
        type: string
    type: object
  github_com_tracerbiubiubiu_zhuzhao_internal_model.MyOrgsResponse:
    properties:
      list:
        items:
          $ref: '#/definitions/github_com_tracerbiubiubiu_zhuzhao_internal_model.MyOrgItem'
        type: array
    type: object
  github_com_tracerbiubiubiu_zhuzhao_internal_model.OrgMemberRosterItem:
    properties:
      avatar:
        type: string
      email:
        type: string
      employee_no:
        type: string
      is_primary:
        type: boolean
      joined_at:
        description: |-
          RFC3339（json 序列化 time.Time）——对齐仓内时间字段惯例；nullable schema 故
          指针+omitempty（检视 P1：曾用 PG ::text 输出空格分隔格式，Safari new Date 不可解析）
        type: string
      org_member_role:
        description: 组内角色（000013）：owner（仅 SetOwners 可设）/ admin / member
        type: string
      phone:
        type: string
      real_name:
        type: string
      status:
        description: 1=启用 0=禁用
        type: integer
      ticket_scope:
        description: 数据范围（000012）：assigned / group / all
        type: string
      user_id:
        example: "0"
        type: string
      username:
        type: string
    type: object
  github_com_tracerbiubiubiu_zhuzhao_internal_model.OrgMemberRosterResponse:
    properties:
      list:
        items:
          $ref: '#/definitions/github_com_tracerbiubiubiu_zhuzhao_internal_model.OrgMemberRosterItem'
