  /api/v1/dict-items/update:
    post:
      consumes:
      - application/json
      parameters:
      - description: 字典写入请求
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/github_com_tracerbiubiubiu_zhuzhao_internal_model.UpdateDictItemRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: 更新字典条目，可省略备注
      tags:
      - dictionary
  /api/v1/dicts/update:
    post:
      consumes:
      - application/json
      parameters:
      - description: 字典写入请求
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/github_com_tracerbiubiubiu_zhuzhao_internal_model.UpdateDictTypeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: 更新字典类型，可省略备注
      tags:
      - dictionary
  /api/v1/files/{key}:
    get:
      description: '定位元数据→状态/purpose 面校验→If-None-Match 命中快照 304→条件读流（etag 作 If-Match，被重放替换即
        404）。avatar 免审计+Cache-Control private（A.4 #5 收窄）；ticket 态 L2 与审计行随 B5-3'
      parameters:
      - description: 对象键（{domain}/{yyyy}/{mm}/{uuid}.{ext}）
        in: path
        name: key
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: 对象流（ETag/nosniff/private/分型 disposition）
          schema:
            type: file
        "304":
          description: 命中 If-None-Match（零传输零审计行）
        "404":
          description: 91003（含 pending/非支持面/替换嫌疑同形）
          schema:
            $ref: '#/definitions/response.Response'
      summary: 文件代理下载（稳定 URL——头像等对象经应用投递）
      tags:
      - storage
  /api/v1/intel/query:
    get:
      description: 外部限流 API 的缓存代理（ACL 防腐——result 上游原样透传）；配额耗尽降级返回过期缓存带 stale 标记
      parameters:
      - description: 情报类型（ip/domain/hash/url）
        in: query
        name: type
        required: true
        type: string
      - description: 查询值
        in: query
        name: value
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
