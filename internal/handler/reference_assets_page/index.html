<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>参考资产目录 · 烛照</title>
  <link rel="stylesheet" href="/extensions/reference-assets/app.css">
  <script type="module" src="/extensions/reference-assets/app.js"></script>
</head>
<body>
  <main>
    <header class="heading">
      <div>
        <p class="product">烛照</p>
        <h1>参考资产目录</h1>
      </div>
      <span class="source-label">合成数据</span>
    </header>

    <section id="signin-panel" class="panel signin" aria-labelledby="signin-title">
      <h2 id="signin-title">登录烛照</h2>
      <form id="signin-form">
        <label for="employee-no">工号</label>
        <input id="employee-no" type="text" autocomplete="username" maxlength="50" required>
        <label for="password">密码</label>
        <input id="password" type="password" autocomplete="current-password" required>
        <div id="captcha-section" hidden>
          <label for="captcha-answer">验证码</label>
          <div class="captcha">
            <input id="captcha-answer" type="text" autocomplete="off" maxlength="8">
            <img id="captcha-image" alt="登录验证码" width="120" height="44">
            <button id="reload-captcha" type="button" class="secondary">换一张</button>
          </div>
        </div>
        <p id="signin-message" class="message" role="status">正在检查登录要求…</p>
        <div class="actions">
          <button id="signin-submit" type="submit" disabled>登录</button>
          <button id="retry-captcha" type="button" class="secondary" hidden>重试</button>
        </div>
      </form>
    </section>

    <section id="query-panel" class="panel" aria-labelledby="query-title" hidden>
      <div class="query-heading">
        <h2 id="query-title">查询资产</h2>
        <button id="clear-session" type="button" class="secondary">清除页面会话</button>
      </div>
      <form id="query-form" class="filters">
        <label for="org-refs">组织 ID
          <input id="org-refs" type="text" autocomplete="off" placeholder="全部有权限的组织">
        </label>
        <label for="status-filter">状态
          <select id="status-filter">
            <option value="">全部</option>
            <option value="healthy">正常</option>
            <option value="degraded">降级</option>
            <option value="down">不可用</option>
            <option value="unknown">未知</option>
          </select>
        </label>
        <label for="page-size">每页数量
          <input id="page-size" type="number" min="1" max="50" value="20" required>
        </label>
        <button id="query-submit" type="submit">查询</button>
      </form>
      <p id="query-message" class="message" role="status">选择筛选条件后查询。</p>
      <p id="source-info" class="metadata" hidden></p>
      <div id="results" class="results" tabindex="0" aria-label="查询结果" hidden>
        <table>
          <thead>
            <tr>
              <th scope="col">资产 ID</th><th scope="col">名称</th><th scope="col">所属组织</th>
              <th scope="col">类别</th><th scope="col">状态</th><th scope="col">观察时间</th><th scope="col">时效</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div class="pagination">
        <button id="next-page" type="button" class="secondary" hidden>下一页</button>
      </div>
    </section>
  </main>
</body>
</html>
