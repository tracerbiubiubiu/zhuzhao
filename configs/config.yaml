server:
  port: 8080
  mode: debug  # debug / release

database:
  host: localhost
  port: 5432
  user: zhuzhao
  password: zhuzhao_dev
  dbname: zhuzhao
  max_open_conns: 25
  max_idle_conns: 5

redis:
  host: localhost
  port: 6379
  db: 0
  password: ""

jwt:
  # Phase 1: HS256 对称签名（单体底座）
  secret: "change-me-in-production"  # 生产环境通过 JWT_SECRET 环境变量覆盖
  # Phase 2: RS256 非对称签名（微服务化时启用）
  # private_key: "${JWT_PRIVATE_KEY}"  # RSA 私钥
  # jwks_url: "/.well-known/jwks.json"  # JWKS 公钥分发 endpoint
  access_ttl: 30m
  refresh_ttl: 168h  # 7天

casbin:
  model: "configs/casbin_model.conf"

log:
  level: debug       # debug / info / warn / error
  dir: "logs"
  max_size: 100      # MB
  max_backups: 7
  max_age: 30        # days
