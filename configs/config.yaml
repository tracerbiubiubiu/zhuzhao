server:
  port: 33333
  mode: debug  # debug / release
  # 信任的反向代理网段（CIDR/IP）。留空 = 不信任任何代理（X-Forwarded-For
  # 不参与 ClientIP 解析，防伪造审计 IP）；Nginx 前置时填其内网网段，如：
  # trusted_proxies: ["10.0.0.0/8"]
  trusted_proxies: []

database:
  host: localhost
  port: 5432
  user: zhuzhao
  password: zhuzhao_dev   # 生产：DB_PASSWORD 环境变量
  dbname: zhuzhao
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 1h
  conn_max_idle_time: 30m
  connect_timeout: 5s
  sslmode: disable        # 生产改为 require
  statement_timeout: 30s  # 0 或不填表示不限制
  application_name: zhuzhao

redis:
  host: localhost
  port: 6379
  db: 0
  password: zhuzhao_dev   # 与 deployments dev compose 的 REDIS_PASSWORD 对齐；生产：REDIS_PASSWORD 环境变量
  pool_size: 20
  min_idle_conns: 5
  pool_timeout: 4s
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s
  max_retries: 2
  conn_max_idle_time: 5m

jwt:
  # Phase 1: HS256 对称签名（单体底座）
  # D2-09：仓库公开值非秘密——debug 可零配置启动，release 拒绝（须 JWT_SECRET 覆盖）
  secret: "dev-only-0123456789abcdef0123456789abcdef0123456789abcdef"
  # Phase 2: RS256 非对称签名（微服务化时启用）
  # private_key: "${JWT_PRIVATE_KEY}"  # RSA 私钥
  # jwks_url: "/.well-known/jwks.json"  # JWKS 公钥分发 endpoint
  access_ttl: 30m
  refresh_ttl: 168h  # 7天

casbin:
  model: "configs/casbin_model.conf"

log:
  level: debug       # debug / info / warn / error
  dir: "logs"
  max_size: 100      # MB
  max_backups: 7
  max_age: 30        # days

# 审计归档（B11②/E-③）：库表 180 天热数据 → JSONL 归档（本地卷）；
# 归档 JSONL 文件保留 395 天后周期清理（>180 等保口径留余量）
audit:
  archive:
    retention_days: 180
    batch_rows: 5000
    out_dir: "data/archive"
    file_retention_days: 395

# 文件存储（Phase 2 启用）
# storage:
#   endpoint: "localhost:9000"     # MinIO / S3 兼容
#   access_key: "minioadmin"
#   secret_key: "minioadmin"
#   bucket: "zhuzhao"
#   region: "us-east-1"
#   use_ssl: false
#   presign_ttl: 15m               # 预签名 URL 有效期

# 任务管理代理（E-④）：zhuzhao → taskrunner API 出站
taskrunner:
  base_url: ""              # taskrunner 服务地址（env TASKRUNNER_BASE_URL）；空 = 任务端点 502
  self_base_url: ""         # 本服务可达地址（缺省 callback 拼接，如 http://zhuzhao:33333）
  ak: zhuzhao
  # sk: 从环境变量 TASKRUNNER_SK 注入
  timeout: 10s

# 网关反代（批次 B/E13）：前缀→上游注册表 + AK/SK 出站签名。upstreams 为空不挂载；
# 开启后反代路由照常过 JWT + 限流 + CasbinAuth（menu_apis）并以本密钥对上游
#（activelist，其 M-A6 验签）签名透传。生产 SK 经 GATEWAY_SK env 覆盖。
gateway:
  ak: zhuzhao
  sk: dev-gateway-sk          # dev 默认；生产经 GATEWAY_SK env 覆盖，不入库不入 git
  upstreams:
    - prefix: /al            # 网关暴露前缀（前端经 /al/api/v1/... 访问 activelist）
      target: http://activelist:8080
      strip_prefix: true     # /al/api/v1/x → 上游 /api/v1/x
