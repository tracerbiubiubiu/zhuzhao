server:
  port: 8080
  mode: debug  # debug / release

database:
  host: localhost
  port: 5432
  user: zhuzhao
  password: zhuzhao_dev   # 生产：DB_PASSWORD 环境变量
  dbname: zhuzhao
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 1h
  conn_max_idle_time: 30m
  connect_timeout: 5s
  sslmode: disable        # 生产改为 require
  statement_timeout: 30s  # 0 或不填表示不限制
  application_name: zhuzhao

redis:
  host: localhost
  port: 6379
  db: 0
  password: ""            # 生产：REDIS_PASSWORD 环境变量
  pool_size: 20
  min_idle_conns: 5
  pool_timeout: 4s
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s
  max_retries: 2
  conn_max_idle_time: 5m

jwt:
  # Phase 1: HS256 对称签名（单体底座）
  secret: "change-me-in-production"  # 生产环境通过 JWT_SECRET 环境变量覆盖
  # Phase 2: RS256 非对称签名（微服务化时启用）
  # private_key: "${JWT_PRIVATE_KEY}"  # RSA 私钥
  # jwks_url: "/.well-known/jwks.json"  # JWKS 公钥分发 endpoint
  access_ttl: 30m
  refresh_ttl: 168h  # 7天

casbin:
  model: "configs/casbin_model.conf"

log:
  level: debug       # debug / info / warn / error
  dir: "logs"
  max_size: 100      # MB
  max_backups: 7
  max_age: 30        # days

# 文件存储（Phase 2 启用）
# storage:
#   endpoint: "localhost:9000"     # MinIO / S3 兼容
#   access_key: "minioadmin"
#   secret_key: "minioadmin"
#   bucket: "zhuzhao"
#   region: "us-east-1"
#   use_ssl: false
#   presign_ttl: 15m               # 预签名 URL 有效期
