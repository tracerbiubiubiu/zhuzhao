# Casbin 模型：g 表消除 + 中间件 BFS 展开
# 借鉴旧系统设计：不使用 [role_definition] g 段，角色继承在中间件层 BFS 展开
# 详见 docs/modules/authz.md §2.1

[request_definition]
r = sub, obj, act

[policy_definition]
p = sub, obj, act

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
# sub 已是展开后的具体角色 code（如 "role::admin"）
# 超管通配：superadmin + admin 角色匹配所有请求
# 工单详情参数是数字 ID。固定的聚合/导出地址须命中自己的策略。
m = r.sub == "role::superadmin" || \
    r.sub == "role::admin" || \
    (r.sub == p.sub && (p.obj == "*" || keyMatch2(r.obj, p.obj)) && \
        (p.obj != "/api/v1/tickets/:id" || regexMatch(r.obj, "^/api/v1/tickets/\d+$")) && \
        (r.act == p.act || p.act == "*"))
