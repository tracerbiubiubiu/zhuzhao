# 最小质量网（09 合集批次三）：lint + 单测。验收脚本需 Docker/Compose，
# 仍按本地验收纪律（make acceptance-2a/2b/2c）人工执行。
name: ci
on:
  push:
    # phase5：Phase 5 实施期活跃分支（phase4 已合回 main 删除，死条目随批清理）
    branches: [dev, main, phase5, "feature/**", "codex/**"]
  pull_request:
# 连续 push 只跑最新提交（对齐 activelist/taskrunner 惯例——过期 run 自动取消省时长）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # 含 swag 安装（走网络），挂起兜底
    steps:
      - uses: actions/checkout@v4
      - name: 安全证据解析器负向检查
        run: python3 scripts/test-parse-govulncheck.py
      - name: 提交格式守卫反例检查
        run: python3 scripts/test-commit-lint.py
      - name: 验收隔离回归检查
        run: python3 scripts/test-acceptance-isolation.py
      - name: 开发编排隔离回归检查
        run: python3 scripts/test-dev-stack.py
      - name: 生成工具入口与回滚预检反例检查
        run: |
          python3 scripts/test-go-tool.py
          python3 scripts/test-migration-template-preflight.py
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: false
      - name: Go格式检查源码边界回归
        run: python3 scripts/test-check-gofmt.py
      # 原 Makefile lint 包含 vet、gofmt 与 Swagger 新鲜度，CI 复用同一入口。
      - name: lint 与 Swagger 新鲜度检查
        run: make lint
      # wire 新鲜度守卫（2026-10-24 B 方案全量修）：providers.go/provideApp 改动后
      # 未跑 make wire 即提交 → 此处拦下（形态同 swagger 守卫——再生后 diff 非零即红）
      - name: wire 新鲜度检查
        run: |
          make wire
          git diff --exit-code internal/app/wire_gen.go
      - run: go build ./...
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # 对齐 activelist/taskrunner 挂起兜底口径
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: false
      - run: make test-unit
      - run: make test-cover
      - name: 保存覆盖率证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: |
            coverage.out
            coverage.html
          if-no-files-found: warn
  test-integration:
    # v3 审计 Y-9（2026-10-23）：integration 标签测试此前从未进 CI（守卫测试
    # "CI 可跑"声称不实——F-2-2 黄项）；ubuntu runner 自带 Docker daemon，
    # testcontainers（PG/RustFS）直接可用。复用原 Makefile 的 -race/-p 1，
    # 单独 job 与 test 并行，超时预算覆盖完整集成门禁。
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: false
      - run: make test-integration
