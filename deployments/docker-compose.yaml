# 完整部署用 compose：包含应用 + 数据库 + 缓存
# D2-33：显式项目名（默认取目录名，与 dev compose 同目录会共享网络/卷前缀）
name: zhuzhao
# 使用方法：
#   1. 先构建镜像：docker build -t zhuzhao:latest -f deployments/Dockerfile .
#   2. 启动：docker compose -f deployments/docker-compose.yaml up -d
#   3. 执行迁移（D2-33：app 镜像不含 migrate 二进制，用官方镜像跑一次性容器；
#      PG 默认不暴露宿主机端口，走 compose 内网 zhuzhao_default）：
#      docker run --rm --network zhuzhao_default \
#        -v "$PWD/migrations:/migrations" \
#        migrate/migrate:v4.17.0 \
#        -path=/migrations \
#        -database "postgres://zhuzhao:${POSTGRES_PASSWORD:-zhuzhao_dev}@postgres:5432/zhuzhao?sslmode=disable" up
#      （或临时打开 postgres 的 ports 映射后走宿主机 make migrate-up）
#
# 密码/密钥等敏感配置请通过 .env 文件注入，不要直接写在这里

services:
  postgres:
    image: postgres:15
    container_name: zhuzhao-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: zhuzhao
      POSTGRES_USER: zhuzhao
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zhuzhao_dev}
      TZ: Asia/Shanghai
    # WAL 归档（2026-09-14 运维补强，对齐 activelist）：pgbackup 侧车只读共享
    # wal_archive 卷作 PITR 原料；archive_timeout=300s 空闲也切段
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_command=test ! -f /wal_archive/%f && cp %p /wal_archive/%f
      - -c
      - archive_timeout=300s
    volumes:
      - pg_data:/var/lib/postgresql/data
      - wal_archive:/wal_archive
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhuzhao"]
      interval: 5s
      timeout: 5s
      retries: 5
    # 部署时默认不暴露端口到宿主机，应用通过 docker 网络访问
    # 如需从宿主机连接调试，取消注释下面两行
    # ports:
    #   - "5432:5432"

  # 每日备份侧车（2026-09-14 运维补强，照抄 activelist pgbackup 模式）：
  # 每日 02:00 pg_dump 全量（zh-*.dump，保留 14 份）+ 失败 10 分钟重试；
  # 借 postgres 镜像的 pg_dump 客户端（与库同版本），不跑数据库。恢复步骤见
  # backup/README.md。
  pgbackup:
    image: postgres:15
    container_name: zhuzhao-pgbackup
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: zhuzhao
      PGPASSWORD: ${POSTGRES_PASSWORD:-zhuzhao_dev}
      PGDATABASE: zhuzhao
      BACKUP_DIR: /backups
      RETAIN_COUNT: "14"
      TZ: Asia/Shanghai
    volumes:
      - backups:/backups
      - ./backup/backup.sh:/usr/local/bin/backup.sh:ro
      - wal_archive:/wal_archive:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh"]
    networks:
      - default
    depends_on:
      postgres:
        condition: service_healthy

  # 迁移一次性服务（2026-09-14 固化，治「演示库静默漂移」）：
  #   docker compose -f deployments/docker-compose.yaml --profile migrate up migrate
  # 首次需拉取 migrate/migrate 镜像（离线环境预 docker pull）。
  migrate:
    image: migrate/migrate:v4.17.0
    profiles: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
    volumes:
      - ../migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database
      - postgres://zhuzhao:${POSTGRES_PASSWORD:-zhuzhao_dev}@postgres:5432/zhuzhao?sslmode=disable
      - up

  redis:
    image: redis:6.2-alpine
    container_name: zhuzhao-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-zhuzhao_dev}   # 生产务必经 .env 覆盖为强密码
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/etc/redis/redis.conf:ro
    # F-18：requirepass 经命令行注入（redis.conf 不支持环境变量插值）
    command: ["sh", "-c", "redis-server /etc/redis/redis.conf --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    image: zhuzhao:latest
    container_name: zhuzhao-app
    restart: unless-stopped
    environment:
      # 通过环境变量覆盖配置，优先级高于 config.yaml
      # D2-02：变量名必须是 APP_DATABASE_*（viper AutomaticEnv 对 database.* 键的
      # 自动映射名）——原 APP_DB_* 五个变量全部不被读取，app 会回退 config.yaml
      # 连 localhost 导致启动失败（phase1/11 号报告实测 APP_DATABASE_* 生效）
      APP_DATABASE_HOST: postgres
      APP_DATABASE_PORT: "5432"
      APP_DATABASE_USER: zhuzhao
      APP_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-zhuzhao_dev}
      APP_DATABASE_DBNAME: zhuzhao
      APP_REDIS_HOST: redis
      APP_REDIS_PORT: "6379"
      APP_REDIS_PASSWORD: ${REDIS_PASSWORD:-zhuzhao_dev}
      APP_SERVER_PORT: "33333"
      APP_SERVER_MODE: release
      TZ: Asia/Shanghai
      # JWT 密钥必须通过环境变量注入，勿使用默认值
      # F-19：jwt.secret 走 BindEnv 显式短名 JWT_SECRET（无 APP_ 前缀）；
      # access/refresh TTL 走 AutomaticEnv 的 APP_ 前缀映射，保持 APP_JWT_*
      JWT_SECRET: ${JWT_SECRET}
      APP_JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-30m}
      APP_JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-168h}
      # 网关反代（批次 B/E13）：SK 须与 activelist 侧 ACTIVELIST_CALLER_ZHUZHAO_SK 同值
      GATEWAY_AK: zhuzhao
      GATEWAY_SK: ${GATEWAY_SK:-dev-gateway-sk}
      # 任务代理 + 内网回调（E-④/E-②）：D 阶段起 taskrunner 容器化（deploy/compose.yaml），
      #   经共享网 zhuzhao_to_taskrunner 服务名寻址；SK 与 taskrunner 侧
      #   TASKRUNNER_CALLER_ZHUZHAO_SK / TASKRUNNER_SELF_SK 同值
      TASKRUNNER_BASE_URL: ${TASKRUNNER_BASE_URL:-http://taskrunner:8080}
      TASKRUNNER_SK: ${TASKRUNNER_SK:-dev-taskrunner-sk}
      INTERNAL_JOBS_SK: ${INTERNAL_JOBS_SK:-dev-callback-sk}
      TASKRUNNER_SELF_BASE_URL: ${TASKRUNNER_SELF_BASE_URL:-http://zhuzhao:33333}
    ports:
      - "${APP_PORT:-33333}:33333"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      default: {}
      zhuzhao_to_activelist: {}
      zhuzhao_to_taskrunner:
        aliases:
          - zhuzhao # taskrunner 回调寻址 http://zhuzhao:33333

# activelist 栈经 zhuzhao_to_activelist、taskrunner 栈（其 deploy/compose.yaml）
# 经 zhuzhao_to_taskrunner 与本栈互通——均 external，由部署侧预建
networks:
  zhuzhao_to_activelist:
    external: true
  zhuzhao_to_taskrunner:
    external: true

volumes:
  pg_data:
  redis_data:
  wal_archive:
  backups:
