# 完整部署用 compose：包含应用 + 数据库 + 缓存
# 使用方法：
#   1. 先构建镜像：docker build -t zhuzhao:latest -f deployments/Dockerfile .
#   2. 启动：docker-compose -f deployments/docker-compose.yaml up -d
#   3. 执行迁移：docker exec zhuzhao-app ./migrate -path migrations -database "..." up
#
# 密码/密钥等敏感配置请通过 .env 文件注入，不要直接写在这里

services:
  postgres:
    image: postgres:15
    container_name: zhuzhao-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: zhuzhao
      POSTGRES_USER: zhuzhao
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zhuzhao_dev}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhuzhao"]
      interval: 5s
      timeout: 5s
      retries: 5
    # 部署时默认不暴露端口到宿主机，应用通过 docker 网络访问
    # 如需从宿主机连接调试，取消注释下面两行
    # ports:
    #   - "5432:5432"

  redis:
    image: redis:6.2-alpine
    container_name: zhuzhao-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/etc/redis/redis.conf:ro
    command: redis-server /etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    image: zhuzhao:latest
    container_name: zhuzhao-app
    restart: unless-stopped
    environment:
      # 通过环境变量覆盖配置，优先级高于 config.yaml
      APP_DB_HOST: postgres
      APP_DB_PORT: "5432"
      APP_DB_USER: zhuzhao
      APP_DB_PASSWORD: ${POSTGRES_PASSWORD:-zhuzhao_dev}
      APP_DB_NAME: zhuzhao
      APP_REDIS_HOST: redis
      APP_REDIS_PORT: "6379"
      APP_SERVER_PORT: "33333"
      APP_SERVER_MODE: release
      # JWT 密钥必须通过环境变量注入，勿使用默认值
      APP_JWT_SECRET: ${JWT_SECRET}
      APP_JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-30m}
      APP_JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-168h}
    ports:
      - "${APP_PORT:-33333}:33333"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pg_data:
  redis_data:
