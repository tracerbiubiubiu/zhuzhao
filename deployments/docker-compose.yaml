# 完整部署用 compose：包含应用 + 数据库 + 缓存
# D2-33：显式项目名（默认取目录名，与 dev compose 同目录会共享网络/卷前缀）
name: zhuzhao
# 使用方法：
#   1. 先构建镜像：docker build -t zhuzhao:latest -f deployments/Dockerfile .
#   2. 启动：docker compose -f deployments/docker-compose.yaml up -d
#   3. 执行迁移（D2-33：app 镜像不含 migrate 二进制，用官方镜像跑一次性容器；
#      PG 默认不暴露宿主机端口，走 compose 内网 zhuzhao_default）：
#      docker run --rm --network zhuzhao_default \
#        -v "$PWD/migrations:/migrations" \
#        migrate/migrate:v4.17.0 \
#        -path=/migrations \
#        -database "postgres://zhuzhao:${POSTGRES_PASSWORD:-zhuzhao_dev}@postgres:5432/zhuzhao?sslmode=disable" up
#      （或临时打开 postgres 的 ports 映射后走宿主机 make migrate-up）
#
# 密码/密钥等敏感配置请通过 .env 文件注入，不要直接写在这里

services:
  postgres:
    image: postgres:15
    container_name: zhuzhao-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: zhuzhao
      POSTGRES_USER: zhuzhao
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zhuzhao_dev}
      TZ: Asia/Shanghai
    # WAL 归档（2026-09-14 运维补强，对齐 activelist）：pgbackup 侧车只读共享
    # wal_archive 卷作 PITR 原料；archive_timeout=300s 空闲也切段
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_command=test ! -f /wal_archive/%f && cp %p /wal_archive/%f
      - -c
      - archive_timeout=300s
    volumes:
      - pg_data:/var/lib/postgresql/data
      - wal_archive:/wal_archive
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhuzhao"]
      interval: 5s
      timeout: 5s
      retries: 5
    # 部署时默认不暴露端口到宿主机，应用通过 docker 网络访问
    # 如需从宿主机连接调试，取消注释下面两行
    # ports:
    #   - "5432:5432"

  # 每日备份侧车（2026-09-14 运维补强，照抄 activelist pgbackup 模式）：
  # 每日 02:00 pg_dump 全量（zh-*.dump，保留 14 份）+ 失败 10 分钟重试；
  # 借 postgres 镜像的 pg_dump 客户端（与库同版本），不跑数据库。恢复步骤见
  # backup/README.md。
  pgbackup:
    image: postgres:15
    container_name: zhuzhao-pgbackup
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: zhuzhao
      PGPASSWORD: ${POSTGRES_PASSWORD:-zhuzhao_dev}
      PGDATABASE: zhuzhao
      BACKUP_DIR: /backups
      RETAIN_COUNT: "14"
      TZ: Asia/Shanghai
    volumes:
      - backups:/backups
      - ./backup/backup.sh:/usr/local/bin/backup.sh:ro
      - wal_archive:/wal_archive:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh"]
    networks:
      - default
    depends_on:
      postgres:
        condition: service_healthy

  # 迁移一次性服务（2026-09-14 固化，治「演示库静默漂移」）：
  #   docker compose -f deployments/docker-compose.yaml --profile migrate up migrate
  # 首次需拉取 migrate/migrate 镜像（离线环境预 docker pull）。
  migrate:
    image: migrate/migrate:v4.17.0
    profiles: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
    volumes:
      - ../migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database
      - postgres://zhuzhao:${POSTGRES_PASSWORD:-zhuzhao_dev}@postgres:5432/zhuzhao?sslmode=disable
      - up

  redis:
    image: redis:6.2-alpine
    container_name: zhuzhao-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-zhuzhao_dev}   # 生产务必经 .env 覆盖为强密码
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/etc/redis/redis.conf:ro
    # F-18：requirepass 经命令行注入（redis.conf 不支持环境变量插值）
    command: ["sh", "-c", "redis-server /etc/redis/redis.conf --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  # RustFS 对象存储（phase5 S5/B5-1 消费；2026-10-16 所有者拍板：MinIO → RustFS——
  #   MinIO 官方已无开源镜像且 AGPLv3，RustFS = Apache 2.0 + S3/MinIO 兼容[实测
  #   /minio/health/live 200、RUSTFS_ROOT_* 兼容 MINIO_ROOT_*]；镜像已拉已冒烟）。
  #   W0 交「可起容器草案」（本次已实测起容器+/health 200/未签名 403 fail-closed），
  #   B5-1 接 `storage:` config 段与验收 + **首日兼容验证 spike**（presign 往返/桶策略/
  #   rclone mirror 实测），test 栈随 B5-1 四档同步。
  #   profile=storage 隔离——默认不起、不改变现栈行为：
  #   docker compose -f deployments/docker-compose.yaml --profile storage up -d rustfs
  #   B5-1 时移除 profiles 行转常驻（随栈自启）。
  # 凭据经 .env 注入（RUSTFS_ROOT_*），生产务必覆盖默认值。
  # ✅ 版本已钉死 1.0.1（2026-10-19 B5-1 批1——判据①实测版本 digest 一致；对齐 postgres:15/redis:6.2 可复现纪律）。
  rustfs:
    image: rustfs/rustfs:1.0.1
    container_name: zhuzhao-rustfs
    restart: unless-stopped
    profiles: ["storage"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      RUSTFS_ROOT_USER: ${RUSTFS_ROOT_USER:-zhuzhao_rustfs}
      RUSTFS_ROOT_PASSWORD: ${RUSTFS_ROOT_PASSWORD:-zhuzhao_rustfs_dev}
      # S3 口 CORS（B5-1 spike 判据①实测通过 2026-10-19）：显式设置后预检完整放行
      # （allow-methods 含 PUT / allow-headers * / expose-headers 含 etag），白名单外
      # Origin 零 CORS 头拦截；⚠ 不设存在反射式 CORS 风险（GHSA-x5xv-223c-8vm7）
      # 必须显式设置；桶级 PutBucketCors 未支持（rustfs 讨论 #736）——全局 env 即可
      # （console 口另有 RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS，容器自带默认 *，独立配置）
      RUSTFS_CORS_ALLOWED_ORIGINS: ${RUSTFS_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    volumes:
      - rustfs_data:/data
    ports:
      # dev 便利映射（浏览器直传需宿主机可达）；生产形态（不暴露/反代）B5-1 定
      - "${RUSTFS_API_PORT:-9000}:9000"
      - "${RUSTFS_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      # 实测（2026-10-16）：/health 200；容器内置 curl/wget/busybox
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RustFS 备份第二实例（B5-5 消费；rclone mirror 目标桶——W0 草案占位，独立卷/独立凭据）：
  # 起步形态 = rclone mirror 定时 + 目标桶版本化（05 号 §7 拍板 #5，工具随 RustFS 切
  # rclone——镜像已拉已验证；mc 对非 MinIO 端点的可用性随 B5-1 spike 一并验证），
  # 恢复演练强制随行。
  rustfs-backup:
    image: rustfs/rustfs:1.0.1
    container_name: zhuzhao-rustfs-backup
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      RUSTFS_ROOT_USER: ${RUSTFS_BACKUP_ROOT_USER:-zhuzhao_rustfs_bk}
      RUSTFS_ROOT_PASSWORD: ${RUSTFS_BACKUP_ROOT_PASSWORD:-zhuzhao_rustfs_bk_dev}
    volumes:
      - rustfs_backup_data:/data
    profiles: ["storage"]


  app:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    image: zhuzhao:latest
    container_name: zhuzhao-app
    restart: unless-stopped
    environment:
      # 通过环境变量覆盖配置，优先级高于 config.yaml
      # D2-02：变量名必须是 APP_DATABASE_*（viper AutomaticEnv 对 database.* 键的
      # 自动映射名）——原 APP_DB_* 五个变量全部不被读取，app 会回退 config.yaml
      # 连 localhost 导致启动失败（phase1/11 号报告实测 APP_DATABASE_* 生效）
      APP_DATABASE_HOST: postgres
      APP_DATABASE_PORT: "5432"
      APP_DATABASE_USER: zhuzhao
      APP_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-zhuzhao_dev}
      APP_DATABASE_DBNAME: zhuzhao
      APP_REDIS_HOST: redis
      APP_REDIS_PORT: "6379"
      APP_REDIS_PASSWORD: ${REDIS_PASSWORD:-zhuzhao_dev}
      APP_SERVER_PORT: "33333"
      APP_SERVER_MODE: release
      # P4-9：信任反代网段（compose bridge）——空则经 ui 的 ClientIP 恒为 nginx IP、限流桶全站共享
      APP_SERVER_TRUSTED_PROXIES: ${APP_SERVER_TRUSTED_PROXIES:-172.16.0.0/12}
      TZ: Asia/Shanghai
      # JWT 密钥必须通过环境变量注入，勿使用默认值
      # F-19：jwt.secret 走 BindEnv 显式短名 JWT_SECRET（无 APP_ 前缀）；
      # access/refresh TTL 走 AutomaticEnv 的 APP_ 前缀映射，保持 APP_JWT_*
      JWT_SECRET: ${JWT_SECRET}
      APP_JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-30m}
      APP_JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-168h}
      # 网关反代（批次 B/E13）：SK 须与 activelist 侧 ACTIVELIST_CALLER_ZHUZHAO_SK 同值
      GATEWAY_AK: zhuzhao
      GATEWAY_SK: ${GATEWAY_SK:?GATEWAY_SK required — repo-known dev SK rejected in release (W0a-P0-1)}
      # 任务代理 + 内网回调（E-④/E-②）：D 阶段起 taskrunner 容器化（deploy/compose.yaml），
      #   经共享网 zhuzhao_to_taskrunner 服务名寻址；SK 与 taskrunner 侧
      #   TASKRUNNER_CALLER_ZHUZHAO_SK / TASKRUNNER_SELF_SK 同值
      TASKRUNNER_BASE_URL: ${TASKRUNNER_BASE_URL:-http://taskrunner:8080}
      TASKRUNNER_SK: ${TASKRUNNER_SK:?TASKRUNNER_SK required — repo-known dev SK rejected in release (W0a-P0-1)}
      INTERNAL_JOBS_SK: ${INTERNAL_JOBS_SK:?INTERNAL_JOBS_SK required — repo-known dev SK rejected in release (W0a-P0-1)}
      TASKRUNNER_SELF_BASE_URL: ${TASKRUNNER_SELF_BASE_URL:-http://zhuzhao:33333}
    ports:
      - "${APP_PORT:-33333}:33333"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      default: {}
      zhuzhao_to_activelist: {}
      zhuzhao_to_taskrunner:
        aliases:
          - zhuzhao # taskrunner 回调寻址 http://zhuzhao:33333

  # P4-9 前端部署件：nginx 静态容器（dist 随镜像构建）+ /api·/al/api 精确反代 app。
  # build context 跨仓相对路径（../zhuzhao-ui——两仓同级 checkout 布局）；
  # app 侧 APP_SERVER_TRUSTED_PROXIES 同批启用（本文件 app.environment 段）。
  ui:
    build:
      context: ../zhuzhao-ui
      dockerfile: deployments/Dockerfile
    image: zhuzhao-ui:latest
    container_name: zhuzhao-ui
    restart: unless-stopped
    environment:
      UPSTREAM_APP: app # nginx envsubst——compose 网络服务名
    ports:
      - "${UI_PORT:-48080}:80"
    depends_on:
      - app
    networks:
      - default

# activelist 栈经 zhuzhao_to_activelist、taskrunner 栈（其 deploy/compose.yaml）
# 经 zhuzhao_to_taskrunner 与本栈互通——均 external，由部署侧预建
networks:
  zhuzhao_to_activelist:
    external: true
  zhuzhao_to_taskrunner:
    external: true

volumes:
  pg_data:
  redis_data:
  wal_archive:
  backups:
  rustfs_data:
  rustfs_backup_data:
