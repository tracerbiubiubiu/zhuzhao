# Redis 配置（Phase 1 单实例）

# AOF 持久化：最多丢 1 秒数据
appendonly yes
appendfsync everysec

# 密码：经 compose command 注入（--requirepass "$$REDIS_PASSWORD"），
# redis.conf 不支持环境变量插值，故不在此写死；密码与 configs/config.yaml
# redis.password / REDIS_PASSWORD 环境变量三方对齐（F-18，2026-08-28 启用）

# 最大内存限制（256MB，够用）
maxmemory 256mb
# D2-01：noeviction——本实例承载安全状态键（user:disabled / blacklist:at / lock:login），
# allkeys-lru 会在内存满时驱逐它们，使吊销/禁用/锁定机制可被攻击者主动废除；
# 全部键均带 TTL 不会无限堆积，写满时新写入报错（fail-closed）优于驱逐安全键
maxmemory-policy noeviction

# 日志级别
loglevel notice
