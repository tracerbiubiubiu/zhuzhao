# 2026-11-12 版本升级：PG18/Redis8 使用新卷；已有环境必须先备份恢复并受控切换。
# 禁止直接 up 后把新空库当作旧库升级成功；步骤见 docs/design/component-upgrade-data-contract.md。
# 本地开发 compose：仅起 PG + Redis 依赖，应用在宿主机 make run/dev
# D2-29：项目名/容器名/卷名与完整部署 compose（docker-compose.yaml）隔离——
# 原两者共享 container_name 与卷，同时/交替使用时数据互污、端口互占
name: zhuzhao-dev

services:
  postgres:
    image: postgres:18.6-trixie@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42          # 独立版本基线，见 component-upgrade-data-contract.md
    container_name: zhuzhao-dev-postgres
    environment:
      POSTGRES_DB: zhuzhao
      POSTGRES_USER: zhuzhao
      POSTGRES_PASSWORD: zhuzhao_dev
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - dev_pg18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U zhuzhao"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.2.11-alpine3.22@sha256:da23c2478319ceb4903857d77a2fd7aa5137d9e9d4c8165dafbacedac6403e95     # 独立版本基线，见 component-upgrade-data-contract.md
    container_name: zhuzhao-dev-redis
    ports:
      - "6379:6379"
    environment:
      REDIS_PASSWORD: zhuzhao_dev   # 与 configs/config.yaml redis.password 对齐
    volumes:
      - dev_redis82_data:/data
      - ./redis/redis.conf:/etc/redis/redis.conf:ro
    # F-18：requirepass 经命令行注入（redis.conf 不支持环境变量插值）
    command: ["sh", "-c", "redis-server /etc/redis/redis.conf --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  # RustFS 对象存储（phase5 S5/B5-1 开发依赖；2026-10-16 所有者拍板 MinIO → RustFS——
  #   Apache 2.0 + S3/MinIO 兼容，镜像已拉已冒烟；W0 工程预备草案）：
  #   profile=storage 隔离——默认不起（不拉镜像时不破坏现栈 up -d）：
  #   docker compose -f deployments/docker-compose.dev.yaml --profile storage up -d rustfs
  #   B5-1 时移除 profiles 行转常驻依赖；config.yaml `storage.endpoint` 对 localhost:9000。
  #   运行版本与多架构 digest 见 component-lock.json；存量升级先执行数据契约。
  rustfs:
    image: rustfs/rustfs:1.0.5@sha256:b81d16a90ee25bd9511280127ca1471788c6e874cf0f0da759645f46b2dc1d74
    container_name: zhuzhao-dev-rustfs
    profiles: ["storage"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      RUSTFS_ROOT_USER: zhuzhao_rustfs
      RUSTFS_ROOT_PASSWORD: zhuzhao_rustfs_dev
      # S3 口 CORS（判据①实测必设——不设存在反射式风险 GHSA-x5xv-223c-8vm7；
      # zhuzhao-ui vite dev 已钉 4000（2026-10-29 同步主栈 compose——5173 为历史端口
      # 保留防回退，白名单过期曾致头像直传 Failed to fetch）
      RUSTFS_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:4000,http://127.0.0.1:4000
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - dev_rustfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 可视（2026-11-02 口径拍板：中间件控制台一律外部化——只挂外部工具，不内嵌
  #   业务应用；profile=tools 隔离，默认不起）：
  #   docker compose -f deployments/docker-compose.dev.yaml --profile tools up -d redisinsight
  #   打开 http://localhost:5540 → Add Database 手输 host=redis port=6379
  #   password=zhuzhao_dev（不做 env 预配置——v1 的 REDIS_HOSTS 在 3.8.0 bundle
  #   零引用已实证废弃，v3 预配置走 RI_PRE_SETUP_DATABASES_PATH 挂 JSON 且预配置
  #   库 UI 不可编辑，dev 工具不值得）。
  #   asynqmon 不挂的原因（2026-11-02 实证三连）：官方 hibiken/asynqmon 停更 3 年+
  #   无 arm64 镜像 + 不兼容本仓 taskrunner 的 asynq v0.26 队列格式（issue #302），
  #   社区 fork 无发布镜像；队列深查现状=zhuzhao-ui jobs/死信三 Tab + redis-cli
  #   --scan --pattern 'asynq:{jobs}:*'；未来需要时给 taskrunner 加 Inspector 只读
  #   端点（它已内置 asynq.Inspector 实例，小批可落）。
  redisinsight:
    image: redis/redisinsight:3.8.0@sha256:b5e19ee240abef6edb435871b90ff8a210995422e8e018ab61c0339d318a1f84   # 版本钉死对齐 rustfs 判据①惯例
    container_name: zhuzhao-dev-redisinsight
    profiles: ["tools"]
    ports:
      - "5540:5540"
    volumes:
      - dev_redisinsight_data:/data

volumes:
  dev_pg18_data:
  dev_redis82_data:
  dev_rustfs_data:
  dev_redisinsight_data:
