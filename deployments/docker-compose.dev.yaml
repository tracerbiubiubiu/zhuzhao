# 本地开发 compose：仅起 PG + Redis 依赖，应用在宿主机 make run/dev
# D2-29：项目名/容器名/卷名与完整部署 compose（docker-compose.yaml）隔离——
# 原两者共享 container_name 与卷，同时/交替使用时数据互污、端口互占
name: zhuzhao-dev

services:
  postgres:
    image: postgres:15          # 对齐云服务版本
    container_name: zhuzhao-dev-postgres
    environment:
      POSTGRES_DB: zhuzhao
      POSTGRES_USER: zhuzhao
      POSTGRES_PASSWORD: zhuzhao_dev
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - dev_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhuzhao"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:6.2-alpine     # 对齐云服务版本
    container_name: zhuzhao-dev-redis
    ports:
      - "6379:6379"
    environment:
      REDIS_PASSWORD: zhuzhao_dev   # 与 configs/config.yaml redis.password 对齐
    volumes:
      - dev_redis_data:/data
      - ./redis/redis.conf:/etc/redis/redis.conf:ro
    # F-18：requirepass 经命令行注入（redis.conf 不支持环境变量插值）
    command: ["sh", "-c", "redis-server /etc/redis/redis.conf --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MinIO 对象存储（phase5 S5/B5-1 开发依赖；W0 工程预备草案——2026-10-16）：
  #   profile=storage 隔离——默认不起（不拉镜像时不破坏现栈 up -d）：
  #   docker compose -f deployments/docker-compose.dev.yaml --profile storage up -d minio
  #   B5-1 时移除 profiles 行转常驻依赖；config.yaml `storage.endpoint` 对 localhost:9000。
  #   ⚠ 版本 B5-1 钉死（latest 为草案期占位）。
  minio:
    image: minio/minio:latest
    container_name: zhuzhao-dev-minio
    profiles: ["storage"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: zhuzhao_minio
      MINIO_ROOT_PASSWORD: zhuzhao_minio_dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - dev_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  dev_pg_data:
  dev_redis_data:
  dev_minio_data:
